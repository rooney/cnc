[package]
name = "find_process_by_name"
version = "0.1.0"
edition = "2024"

[dependencies]
stdlite = {path="../../stdlite"}
utf16_lit = "2.0.2"
windows-sys = {version="0.61", features=[
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "z"
strip = true
lto = true
